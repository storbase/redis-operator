apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: redis-failover-steady
spec:
  steps:
  - name: apply-and-verify-failover-steady-state
    try:
    - script:
        timeout: 2m
        content: |
          set -eu
          bash ../../scripts/create_tls_secret.sh \
            redis-e2e \
            redis-failover-tls \
            redis-failover.redis-e2e.svc.cluster.local \
            '*.redis-failover-redis-headless.redis-e2e.svc.cluster.local' \
            '*.redis-failover-sentinel.redis-e2e.svc.cluster.local' \
            'redis-failover-redis.redis-e2e.svc.cluster.local' \
            'redis-failover-sentinel.redis-e2e.svc.cluster.local'
    - apply:
        file: redis.yaml
    - assert:
        timeout: 10m
        file: assert-ready.yaml
    - script:
        timeout: 10m
        content: |
          set -eu
          bash ../../scripts/assert_failover.sh redis-e2e redis-failover mymaster failover-redis-pass-123 failover-sentinel-pass-123
    - script:
        timeout: 12m
        content: |
          set -eu
          bash ../../scripts/assert_failover_recovery.sh redis-e2e redis-failover mymaster failover-redis-pass-123 failover-sentinel-pass-123
