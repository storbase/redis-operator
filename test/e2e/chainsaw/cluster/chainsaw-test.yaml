apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: redis-cluster-bootstrap
spec:
  steps:
  - name: apply-and-verify-cluster
    try:
    - apply:
        file: redis.yaml
    - assert:
        timeout: 10m
        file: assert-ready.yaml
    - script:
        timeout: 10m
        content: |
          set -eu
          bash ../../scripts/assert_cluster.sh redis-e2e redis-cluster cluster-pass-123
