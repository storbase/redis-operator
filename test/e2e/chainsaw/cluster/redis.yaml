apiVersion: v1
kind: Secret
metadata:
  name: redis-cluster-auth
  namespace: redis-e2e
type: Opaque
stringData:
  password: cluster-pass-123
---
apiVersion: redis.storbase.io/v1alpha1
kind: Redis
metadata:
  name: redis-cluster
  namespace: redis-e2e
spec:
  mode: Cluster
  image: docker.io/library/redis:8.6.1
  imagePullPolicy: IfNotPresent
  tls:
    secretName: redis-cluster-tls
  auth:
    redisPasswordSecretRef:
      name: redis-cluster-auth
      key: password
  cluster:
    shards: 3
    replicasPerShard: 1
    storage:
      size: 1Gi
