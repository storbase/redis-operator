name: CI

on:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run linter
        uses: golangci/golangci-lint-action@v8
        with:
          install-mode: goinstall
          version: v2.3.0

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: make test

  helm-chart:
    name: Helm Chart
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm 4
        uses: azure/setup-helm@v4
        with:
          version: v4.1.1

      - name: Validate chart
        run: make helm-test

  envtest:
    name: Envtest
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run envtest
        run: make test-integration

  e2e:
    name: E2E on Kind (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs:
      - envtest
      - helm-chart
    strategy:
      fail-fast: false
      matrix:
        suite:
          - cluster
          - failover
          - failover-external
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -sSL -o ./kind https://kind.sigs.k8s.io/dl/v0.22.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Setup Helm 4
        uses: azure/setup-helm@v4
        with:
          version: v4.1.1

      - name: Install chainsaw
        run: |
          curl -sSL -o /tmp/chainsaw.tar.gz https://github.com/kyverno/chainsaw/releases/download/v0.2.11/chainsaw_linux_amd64.tar.gz
          tar -xzf /tmp/chainsaw.tar.gz -C /tmp
          sudo mv /tmp/chainsaw /usr/local/bin/chainsaw
          chainsaw version

      - name: Run e2e
        run: |
          make e2e \
            E2E_CHAINSAW_SUITES=${{ matrix.suite }} \
            E2E_ARTIFACT_DIR_PR=test/e2e/artifacts/pr/${{ matrix.suite }}

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ matrix.suite }}
          path: test/e2e/artifacts/pr/${{ matrix.suite }}
          if-no-files-found: ignore
