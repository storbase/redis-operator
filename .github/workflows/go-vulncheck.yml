name: Go Vulncheck

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "10 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: |
          set -euo pipefail
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
