name: Release Operator

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (accepts vX.Y.Z or X.Y.Z)"
        required: true
        type: string
      target_ref:
        description: "Target ref to tag"
        required: false
        default: main
        type: string

permissions:
  contents: write
  packages: write

jobs:
  prepare-tag:
    name: Prepare Release Tag
    runs-on: ubuntu-latest
    outputs:
      operator_tag: ${{ steps.prepare.outputs.operator_tag }}
      chart_version: ${{ steps.prepare.outputs.chart_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare tag context
        id: prepare
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGET_REF: ${{ inputs.target_ref || 'main' }}
        run: |
          set -euo pipefail

          raw_version="${INPUT_VERSION}"
          target_ref="${INPUT_TARGET_REF}"

          operator_tag="${raw_version}"
          if [[ ! "$operator_tag" =~ ^v ]]; then
            operator_tag="v${operator_tag}"
          fi

          if [[ ! "$operator_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Error: invalid version '${raw_version}'. Expected stable semver like v0.2.0 or 0.2.0."
            exit 1
          fi

          chart_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"

          git fetch --force --tags origin
          git fetch --force origin "+refs/heads/*:refs/remotes/origin/*"
          if git ls-remote --exit-code --tags origin "refs/tags/${operator_tag}" >/dev/null 2>&1; then
            echo "Error: tag '${operator_tag}' already exists on origin."
            exit 1
          fi

          resolved_ref="${target_ref}"
          if ! git rev-parse --verify --quiet "${resolved_ref}^{commit}" >/dev/null; then
            if git rev-parse --verify --quiet "origin/${target_ref}^{commit}" >/dev/null; then
              resolved_ref="origin/${target_ref}"
            else
              echo "Error: target_ref '${target_ref}' does not resolve to a commit."
              exit 1
            fi
          fi

          resolved_sha="$(git rev-parse "${resolved_ref}^{commit}")"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${operator_tag}" "${resolved_sha}" -m "Release ${operator_tag}"
          git push origin "refs/tags/${operator_tag}"

          {
            echo "operator_tag=${operator_tag}"
            echo "chart_version=${chart_version}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Manual release dispatch"
            echo "Created and pushed tag \`${operator_tag}\` from \`${resolved_ref}\` (\`${resolved_sha}\`)."
            echo "This workflow run continues to execute the full release pipeline."
          } >> "$GITHUB_STEP_SUMMARY"

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: prepare-tag
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-tag.outputs.operator_tag }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Helm 4
        uses: azure/setup-helm@v4
        with:
          version: v4.1.1

      - name: Run lint
        run: make lint

      - name: Run unit tests
        run: make test

      - name: Run integration tests
        run: make test-integration

      - name: Run helm checks
        run: |
          make helm-test
          make helm-verify-docs

  publish-image:
    name: Publish Image
    runs-on: ubuntu-latest
    needs:
      - prepare-tag
      - quality-gate
    env:
      IMAGE_REPO: ghcr.io/storbase/redis-operator
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-tag.outputs.operator_tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_REPO }}:${{ needs.prepare-tag.outputs.operator_tag }}

  sync-chart-main:
    name: Sync Chart To Main
    runs-on: ubuntu-latest
    needs:
      - prepare-tag
      - publish-image
    outputs:
      chart_changed: ${{ steps.sync.outputs.chart_changed }}
      chart_sync_commit_sha: ${{ steps.sync.outputs.chart_sync_commit_sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Sync and push chart metadata
        id: sync
        run: |
          set -euo pipefail

          ./hack/release/sync-chart-version.sh "${{ needs.prepare-tag.outputs.operator_tag }}"

          if git diff --quiet -- charts/redis-operator; then
            echo "chart_changed=false" >> "$GITHUB_OUTPUT"
            echo "chart_sync_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/redis-operator/Chart.yaml charts/redis-operator/values.yaml charts/redis-operator/README.md
          git commit -m "chore(chart): sync chart to ${{ needs.prepare-tag.outputs.operator_tag }}"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

          echo "chart_changed=true" >> "$GITHUB_OUTPUT"
          echo "chart_sync_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish-chart:
    name: Publish Helm Chart
    runs-on: ubuntu-latest
    needs:
      - prepare-tag
      - sync-chart-main
    outputs:
      chart_version: ${{ steps.publish.outputs.chart_version }}
      chart_ref: ${{ steps.publish.outputs.chart_ref }}
      chart_publish_status: ${{ steps.publish.outputs.chart_publish_status }}
    env:
      CHART_DIR: charts/redis-operator
      REGISTRY_HOST: ghcr.io
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Helm 4
        uses: azure/setup-helm@v4
        with:
          version: v4.1.1

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Validate chart release metadata
        run: ./hack/release/verify-chart-release.sh

      - name: Login to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY_HOST" --username "${{ github.actor }}" --password-stdin

      - name: Publish chart if needed
        id: publish
        env:
          OWNER: ${{ github.repository_owner }}
          EXPECTED_CHART_VERSION: ${{ needs.prepare-tag.outputs.chart_version }}
        run: |
          set -euo pipefail

          chart_name="$(awk '$1 == "name:" { print $2; exit }' "${CHART_DIR}/Chart.yaml")"
          chart_version="$(awk '$1 == "version:" { print $2; exit }' "${CHART_DIR}/Chart.yaml")"
          if [ -z "$chart_name" ] || [ -z "$chart_version" ]; then
            echo "Error: failed to parse chart name/version from ${CHART_DIR}/Chart.yaml."
            exit 1
          fi

          if [ "$chart_version" != "$EXPECTED_CHART_VERSION" ]; then
            echo "Error: chart version '${chart_version}' does not match expected '${EXPECTED_CHART_VERSION}'."
            exit 1
          fi

          owner_lc="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          chart_ref="oci://${REGISTRY_HOST}/${owner_lc}/charts/${chart_name}"
          chart_publish_status="published"

          if helm show chart "$chart_ref" --version "$chart_version" >/dev/null 2>&1; then
            chart_publish_status="already_exists"
          else
            make helm-test
            make helm-verify-docs

            mkdir -p .chart-packages
            helm package "$CHART_DIR" --destination .chart-packages
            chart_archive=".chart-packages/${chart_name}-${chart_version}.tgz"
            if [ ! -f "$chart_archive" ]; then
              echo "Error: expected chart archive '$chart_archive' is missing."
              exit 1
            fi

            helm push "$chart_archive" "$chart_ref"
          fi

          {
            echo "chart_version=${chart_version}"
            echo "chart_ref=${chart_ref}"
            echo "chart_publish_status=${chart_publish_status}"
          } >> "$GITHUB_OUTPUT"

  release-github:
    name: Create Operator GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare-tag
      - publish-image
      - sync-chart-main
      - publish-chart
    env:
      IMAGE_REPO: ghcr.io/storbase/redis-operator
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-tag.outputs.operator_tag }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build install manifest
        run: |
          make build-installer IMG=${IMAGE_REPO}:${{ needs.prepare-tag.outputs.operator_tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-tag.outputs.operator_tag }}
          generate_release_notes: true
          files: |
            dist/install.yaml

      - name: Build Helm chart release note block
        run: |
          set -euo pipefail

          chart_changed='${{ needs.sync-chart-main.outputs.chart_changed }}'
          chart_sync_commit_sha='${{ needs.sync-chart-main.outputs.chart_sync_commit_sha }}'

          {
            echo "<!-- helm-chart-release-block:start -->"
            echo "## Helm Chart"
            echo "- Version: \`${{ needs.publish-chart.outputs.chart_version }}\`"
            echo "- OCI Reference: \`${{ needs.publish-chart.outputs.chart_ref }}\`"
            echo "- Publish Status: \`${{ needs.publish-chart.outputs.chart_publish_status }}\`"
            if [ "$chart_changed" = "true" ]; then
              echo "- Chart Sync Commit: \`${chart_sync_commit_sha}\`"
            else
              echo "- Chart Sync Commit: not changed (chart already aligned with this tag)."
            fi
            echo "<!-- helm-chart-release-block:end -->"
          } > /tmp/chart-release-notes-block.md

      - name: Append Helm chart block to release notes
        env:
          RELEASE_TAG: ${{ needs.prepare-tag.outputs.operator_tag }}
        run: |
          set -euo pipefail

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          release_id="$(echo "$release_json" | jq -r '.id')"
          current_body="$(echo "$release_json" | jq -r '.body // ""')"

          cleaned_body="$(printf '%s\n' "$current_body" | awk '
            BEGIN { skip = 0 }
            /^<!-- helm-chart-release-block:start -->$/ { skip = 1; next }
            /^<!-- helm-chart-release-block:end -->$/ { skip = 0; next }
            skip == 0 { print }
          ')"

          block="$(cat /tmp/chart-release-notes-block.md)"
          if [ -n "$cleaned_body" ]; then
            new_body="${cleaned_body}"
            new_body+=$'\n\n'
            new_body+="${block}"
          else
            new_body="${block}"
          fi

          jq -n --arg body "$new_body" '{body: $body}' > /tmp/release-patch.json
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --input /tmp/release-patch.json
