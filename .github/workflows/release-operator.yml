name: Release Operator

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  validate-tag:
    name: Validate Operator Tag
    runs-on: ubuntu-latest
    outputs:
      operator_tag: ${{ steps.parse.outputs.operator_tag }}
      chart_version: ${{ steps.parse.outputs.chart_version }}
    steps:
      - name: Validate stable semver tag
        id: parse
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Error: invalid operator tag '$tag'. Expected stable semver like v0.2.0."
            exit 1
          fi
          chart_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          echo "operator_tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${chart_version}" >> "$GITHUB_OUTPUT"

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: validate-tag
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Helm 4
        uses: azure/setup-helm@v4
        with:
          version: v4.1.1

      - name: Run lint
        run: make lint

      - name: Run unit tests
        run: make test

      - name: Run integration tests
        run: make test-integration

      - name: Run helm checks
        run: |
          make helm-test
          make helm-verify-docs

  publish-image:
    name: Publish Image
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - quality-gate
    env:
      IMAGE_REPO: ghcr.io/storbase/redis-operator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
          tags: ${{ env.IMAGE_REPO }}:${{ needs.validate-tag.outputs.operator_tag }}

  release-github:
    name: Create Operator GitHub Release
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - publish-image
    env:
      IMAGE_REPO: ghcr.io/storbase/redis-operator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build install manifest
        run: |
          make build-installer IMG=${IMAGE_REPO}:${{ needs.validate-tag.outputs.operator_tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-tag.outputs.operator_tag }}
          generate_release_notes: true
          files: |
            dist/install.yaml

  sync-chart-pr:
    name: Create Chart Sync PR
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - release-github
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Sync chart metadata
        run: |
          ./hack/release/sync-chart-version.sh "${{ needs.validate-tag.outputs.operator_tag }}"

      - name: Detect chart changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet -- charts/redis-operator; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: release/chart-sync-${{ needs.validate-tag.outputs.operator_tag }}
          title: "chore(chart): sync chart to ${{ needs.validate-tag.outputs.operator_tag }}"
          commit-message: "chore(chart): sync chart to ${{ needs.validate-tag.outputs.operator_tag }}"
          body: |
            Sync chart metadata to match operator release `${{ needs.validate-tag.outputs.operator_tag }}`.

            This PR was created automatically by the operator release workflow.
          add-paths: |
            charts/redis-operator/Chart.yaml
            charts/redis-operator/values.yaml
            charts/redis-operator/README.md
          delete-branch: true
