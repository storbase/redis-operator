name: Release Helm Chart

on:
  push:
    tags:
      - "chart-v*"

permissions:
  contents: read
  packages: write

jobs:
  release-chart:
    name: Release Chart To GHCR
    runs-on: ubuntu-latest
    env:
      CHART_DIR: charts/redis-operator
      REGISTRY_HOST: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm 4
        uses: azure/setup-helm@v4
        with:
          version: v4.1.1

      - name: Validate chart version against git tag
        run: |
          set -euo pipefail
          chart_version="$(helm show chart "$CHART_DIR" | awk '/^version:/{print $2; exit}')"
          expected_tag="chart-v${chart_version}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Tag '$GITHUB_REF_NAME' does not match chart version '$chart_version' (expected '$expected_tag')."
            exit 1
          fi

      - name: Helm lint
        run: helm lint "$CHART_DIR"

      - name: Package chart
        run: |
          set -euo pipefail
          mkdir -p .chart-packages
          helm package "$CHART_DIR" --destination .chart-packages

      - name: Login to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY_HOST" --username "${{ github.actor }}" --password-stdin

      - name: Push chart
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner_lc="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          chart_archive="$(ls .chart-packages/redis-operator-*.tgz)"
          helm push "$chart_archive" "oci://${REGISTRY_HOST}/${owner_lc}/charts"
