name: Release Helm Chart

on:
  push:
    tags:
      - "chart-v*"

permissions:
  contents: write
  packages: write

jobs:
  release-chart:
    name: Release Chart To GHCR
    runs-on: ubuntu-latest
    env:
      CHART_DIR: charts/redis-operator
      REGISTRY_HOST: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Helm 4
        uses: azure/setup-helm@v4
        with:
          version: v4.1.1

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Validate chart release metadata
        run: ./hack/release/verify-chart-release.sh "${GITHUB_REF_NAME}"

      - name: Run chart checks
        run: |
          make helm-test
          make helm-verify-docs

      - name: Package chart
        id: package
        run: |
          set -euo pipefail
          mkdir -p .chart-packages
          helm package "$CHART_DIR" --destination .chart-packages
          chart_archive="$(ls .chart-packages/redis-operator-*.tgz)"
          echo "chart_archive=${chart_archive}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY_HOST" --username "${{ github.actor }}" --password-stdin

      - name: Push chart
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner_lc="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          helm push "${{ steps.package.outputs.chart_archive }}" "oci://${REGISTRY_HOST}/${owner_lc}/charts"

      - name: Create Chart GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: redis-operator chart ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.chart_archive }}
